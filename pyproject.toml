[project]
name = "crawl-mm"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "speed1313", email = "speedtry13@icloud.com" }
]
dependencies = [
    "tqdm>=4.67.1",
    "mecab-python3>=1.0.10",
    "unidic-lite>=1.0.8",
    "matplotlib>=3.10.0",
    "japanize-matplotlib>=1.1.3",
    "setuptools>=75.6.0",
    "warcio>=1.7.5",
    "numpy==1.26.4",
    "huggingface-hub>=0.27.0",
    "trafilatura>=2.0.0",
    "fastwarc>=0.15.1",
    "loguru>=0.7.3",
    "pandas>=2.2.3",
    "datasets==4.0.0",
    "lingua-language-detector>=2.0.2",
    "pysimdjson>=6.0.2",
    "fast-langdetect>=0.2.4",
    "parquet-cli>=1.3",
    "transformers>=4.48.0",
    "clip-anytorch>=2.6.0",
    "autokeras>=2.0.0",
    "open-clip-torch>=2.30.0",
    "emoji>=2.14.1",
    "detoxify>=0.5.2",
    "fugashi[unidic-lite]>=1.4.0",
    "datasketch>=1.6.5",
    "wandb>=0.16.6",
    "albumentations==1.1.0",
    "img2dataset>=1.45.0",
    "webdataset>=0.2.100",
    "beautifulsoup4>=4.13.4",
    "wikiextractor",
    "mwparserfromhell>=0.6.6",
    "markdownify>=1.1.0",
    "wikitextparser>=0.56.4",
    "lap>=0.5.12",
    "seaborn>=0.13.2",
    "imagehash>=4.3.2",
    "backoff>=2.2.1",
    "chardet>=5.2.0",
    "fasttext>=0.9.3",
    "aiohttp>=3.11.18",
    "aiofiles>=24.1.0",
    "einops>=0.8.1",
    "tldextract>=5.3.0",
    "tabulate>=0.9.0",
    "bloom-filter2>=2.0.0",
    "mmh3>=5.1.0",
    "accelerate>=1.8.1",
    "polars>=1.31.0",
    "xxhash>=3.5.0",
    "certifi>=2025.4.26",
    "ray>=2.50.1",
]
readme = "README.md"
requires-python = ">= 3.12"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/crawl_mm"]

[tool.uv.sources]
wikiextractor = { git = "https://github.com/attardi/wikiextractor.git", rev = "ab8988ebfa9e4557411f3d4c0f4ccda139e18875" }

[dependency-groups]
dev = [
    "pqcat>=0.0.5",
    "pytest>=8.3.4",
    "ruff>=0.9.2",
]

